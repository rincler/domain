name: CI

on: push

jobs:
  tests:
    strategy:
      matrix:
        php: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    name: Test on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set composer cache path
        id: set-composer-cache-path
        run: echo "composer-cache-path=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-composer-cache-path.outputs.composer-cache-path }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}

      - name: Install dependencies
        run: composer update --prefer-dist

      - name: PHP version
        run: php -v

      - name: Run tests
        run: composer test

  linter:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0

      - name: Set composer cache path
        id: set-composer-cache-path
        run: echo "composer-cache-path=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-composer-cache-path.outputs.composer-cache-path }}
          key: ${{ runner.os }}-${{ hashFiles('**/composer.json') }}

      - name: Install dependencies
        run: composer update --prefer-dist

      - name: PHP version
        run: php -v

      - name: Lint code
        uses: super-linter/super-linter@v7.2.1
        env:
          FILTER_REGEX_EXCLUDE: .*vendor.*
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_PHP_PSALM: false
          VALIDATE_JSCPD: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
